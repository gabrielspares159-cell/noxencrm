<style>
/* Layout: menu lateral fixo (gaveta no celular) + barra superior com busca + área da seção. Identidade Noxen: azul #2878FF, lima #B8F34A, tinta #080B12. */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f8f9fc; --ink: #0b1020; --muted: #5b6478; --line: #e2e6ee;

  --f-title: "Sora", "Segoe UI", system-ui, sans-serif; --f-body: "Figtree", "Segoe UI", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #080b12; --surface: #111622; --surface-2: #0d121c; --ink: #e8ecf4; --muted: #8c96ab; --line: #222a3a;
  --accent: #4d8dff; --accent-ink: #061124; --accent-soft: #14213b; --lime: #b8f34a; --lime-soft: #1f2a0d; --lime-ink: #c9f772;
  --ok: #57c98a; --ok-soft: #12301f; --warn: #e8a84c; --warn-soft: #34260f; --bad: #ff7d71; --bad-soft: #3a1917;
  --vio: #a592ff; --vio-soft: #241d42; --side: #05070c; --side-ink: #c9d1e0; --side-muted: #7d879b; --side-hi: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #080b12; --surface: #111622; --surface-2: #0d121c; --ink: #e8ecf4; --muted: #8c96ab; --line: #222a3a;
  --accent: #4d8dff; --accent-ink: #061124; --accent-soft: #14213b; --lime: #b8f34a; --lime-soft: #1f2a0d; --lime-ink: #c9f772;
  --ok: #57c98a; --ok-soft: #12301f; --warn: #e8a84c; --warn-soft: #34260f; --bad: #ff7d71; --bad-soft: #3a1917;
  --vio: #a592ff; --vio-soft: #241d42; --side: #05070c; --side-ink: #c9d1e0; --side-muted: #7d879b; --side-hi: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; }
/* menu lateral */
.side { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 20px 12px calc(16px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); gap: 6px; overflow-y: auto; z-index: 20; }
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.marca .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--lime); color: #080b12; display: grid; place-items: center; font-family: var(--f-title); font-weight: 700; font-size: 16px; }
.marca b { font-family: var(--f-title); font-weight: 700; color: var(--side-hi); font-size: 17px; letter-spacing: .01em; }
.marca span { display: block; font-size: 12px; color: var(--side-muted); }
.nav { display: grid; gap: 2px; }

.nav button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; opacity: .85; }

.nav .n { margin-left: auto; font-family: var(--f-mono); font-size: 11.5px; color: var(--side-muted); }
.side-rodape { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.08); display: grid; gap: 8px; font-size: 12.5px; color: var(--side-muted); }
.side-rodape button { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: var(--side-ink); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 12.5px; text-align: left; }
.sync { display: flex; align-items: center; gap: 7px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--side-muted); flex: none; }
.sync.on i { background: var(--lime); } .sync.local i { background: #e8a84c; }
/* barra superior */
.main { min-width: 0; display: flex; flex-direction: column; }
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px max(20px, env(safe-area-inset-right, 0px)) 10px max(20px, env(safe-area-inset-left, 0px)); }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px; cursor: pointer; }
.menu-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; }
.busca { flex: 1; max-width: 560px; position: relative; }
.busca input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 9px 36px; }
.busca svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 2; }
.topo .data { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.conteudo { padding: 24px max(20px, env(safe-area-inset-right, 0px)) 64px max(20px, env(safe-area-inset-left, 0px)); max-width: 1240px; width: 100%; }
/* elementos comuns */
h1 { font-family: var(--f-title); font-weight: 700; font-size: 26px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-title); font-weight: 600; font-size: 17px; margin: 0; }
h3 { font-size: 15.5px; margin: 0; font-weight: 700; }
.cab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
.cab p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.card > h2 { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.kpi .rot { color: var(--muted); font-size: 13px; }
.kpi .val { font-family: var(--f-title); font-size: 28px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
.kpi .sub { color: var(--muted); font-size: 12.5px; }
.barra { height: 7px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.barra > div { height: 100%; background: var(--accent); border-radius: 99px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.p-azul { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.p-lima { background: var(--lime-soft); color: var(--lime-ink); border-color: transparent; }

.p-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.lima { background: var(--lime); border-color: var(--lime); color: #0b1020; }
.btn.mini { padding: 4px 9px; font-size: 12.5px; }
.btn.fantasma { border-color: transparent; background: none; color: var(--accent); padding-inline: 4px; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filtros select, .filtros input[type="text"], .filtros input[type="search"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13.5px; max-width: 100%; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg button b { font-family: var(--f-mono); font-weight: 500; font-size: 11.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg button[aria-pressed="true"] b { color: var(--surface); opacity: .75; }
.lista { display: grid; }
.item { display: grid; gap: 4px; padding: 12px 4px; border-top: 1px solid var(--line); min-width: 0; }
.item:first-child { border-top: 0; }
.item.clic { cursor: pointer; border-radius: 8px; padding-inline: 10px; }
.item.clic:hover { background: var(--surface-2); }
.linha { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; min-width: 0; }
.linha > :first-child { min-width: 0; }
.dir { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 13px; }
.vazio { border: 1px dashed var(--line); border-radius: 10px; padding: 18px; color: var(--muted); font-size: 14px; background: var(--surface-2); }
.vazio b { color: var(--ink); }
.tab { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }

.dl { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 8px 16px; font-size: 14px; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.texto-msg { font-family: var(--f-body); white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14.5px; margin: 0; overflow-wrap: anywhere; }
.md { font-size: 15px; line-height: 1.6; max-width: 78ch; overflow-wrap: anywhere; }
.md h1 { font-size: 22px; margin: 18px 0 8px; } .md h2 { font-size: 18px; margin: 22px 0 8px; } .md h3 { margin: 18px 0 6px; }
.md table { font-size: 13px; } .md .tab { margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; }
.md blockquote { margin: 10px 0; padding: 8px 14px; border-left: 3px solid var(--lime); background: var(--surface-2); border-radius: 0 8px 8px 0; }

.voltar { margin-bottom: 14px; }
.det-cab { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 10px 0 18px; }
.galeria img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
.funil { display: grid; gap: 8px; }
.funil .f { display: grid; grid-template-columns: 130px 1fr 34px; gap: 10px; align-items: center; font-size: 13.5px; cursor: pointer; }
.funil .f .b { height: 10px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }

.quando { font-size: 12px; font-weight: 600; }
.q-atr { color: var(--bad); } .q-hoje { color: var(--warn); } .q-prox { color: var(--accent); }

.ev { font-size: 11.5px; line-height: 1.25; padding: 2px 5px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; border: 0; text-align: left; width: 100%; }
.ev.t-Comercial, .ev.t-Retorno { background: var(--lime-soft); color: var(--lime-ink); } .ev.t-Financeiro, .ev.t-Vencimento { background: var(--warn-soft); color: var(--warn); }
.ev.t-Conteúdo { background: var(--vio-soft); color: var(--vio); } .ev.t-Reunião, .ev.t-Cliente { background: var(--ok-soft); color: var(--ok); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

.toc { position: sticky; top: 76px; display: grid; gap: 2px; align-self: start; }
.toc a { text-decoration: none; color: var(--muted); font-size: 13.5px; padding: 5px 10px; border-radius: 6px; }
.toc a:hover { background: var(--surface); color: var(--ink); }
.base-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; }

/* estúdio criativo */
.estudio-topo { position: relative; overflow: hidden; border-radius: 16px; padding: 22px; margin-bottom: 18px; color: #f2f5fb; background: radial-gradient(120% 140% at 100% 0%, rgba(184,243,74,.28) 0%, rgba(184,243,74,0) 45%), radial-gradient(90% 120% at 0% 100%, rgba(40,120,255,.55) 0%, rgba(40,120,255,0) 60%), #080b12; }
.estudio-topo h1 { color: #fff; } .estudio-topo p { color: #c3cbdb; margin: 6px 0 0; max-width: 64ch; }
.estudio-topo .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 18px; }
.estudio-topo .tile { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 12px; text-align: left; color: #f2f5fb; cursor: pointer; display: grid; gap: 4px; }
.estudio-topo .tile:hover { border-color: #b8f34a; background: rgba(184,243,74,.08); }

.abas { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.abas button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.abas button b { font-family: var(--f-mono); font-weight: 500; font-size: 11.5px; }
.abas button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.quadro-kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.coluna { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 10px; align-content: start; min-height: 140px; }
.coluna > h3 { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 2px 4px; }
.proj { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); text-align: left; padding: 0; display: block; width: 100%; color: var(--ink); }
.proj:hover { border-color: var(--accent); }
.proj .capa { aspect-ratio: 16/10; background: var(--surface-2) center 25% / cover no-repeat; display: grid; place-items: center; color: var(--muted); }
.proj .capa svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 1.5; opacity: .6; }

.story { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; }

.quadro .tela { aspect-ratio: var(--ar, 4/5); background: repeating-linear-gradient(45deg, var(--surface-2) 0 10px, var(--surface) 10px 20px); position: relative; display: grid; place-items: center; color: var(--muted); font-size: 12.5px; overflow: hidden; }
.quadro .tela img, .quadro .tela video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.quadro .num { position: absolute; top: 8px; left: 8px; z-index: 1; background: rgba(8,11,18,.82); color: #fff; font-family: var(--f-mono); font-size: 11px; border-radius: 6px; padding: 2px 7px; }
.quadro .info { padding: 10px 12px; display: grid; gap: 6px; font-size: 13px; }

.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--muted); cursor: pointer; font-size: 13.5px; background: var(--surface-2); }
.drop:hover, .drop.sobre { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }

.midia { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

.midia .m { aspect-ratio: 1; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; position: relative; }
.midia .m img, .midia .m video { width: 100%; height: 100%; object-fit: cover; display: block; }
.midia .m.logo img { object-fit: contain; padding: 10px; background: #062417; }
.midia .m.link { padding: 12px; text-align: center; font-size: 12.5px; color: var(--accent); overflow-wrap: anywhere; background: var(--accent-soft); text-decoration: none; }
.midia figcaption { padding: 8px 9px; font-size: 12.5px; display: grid; gap: 6px; }

  return ev;
}

function abrirForm(titulo, campos, valores, aoSalvar, { extra = "" } = {}) {
  const v = valores || {};
  const campo = c => {
    const id = "f-" + c.k; const val = v[c.k] ?? c.padrao ?? "";
    let inp;
    if (c.tipo === "textarea") inp = `<textarea id="${id}" name="${c.k}" rows="${c.linhas || 4}">${esc(val)}</textarea>`;
    else if (c.tipo === "select") inp = `<select id="${id}" name="${c.k}">${(c.opcoes || []).map(o => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else if (c.tipo === "date") inp = `<input id="${id}" name="${c.k}" type="date" value="${esc(iso(data(val)))}">`;
    else inp = `<input id="${id}" name="${c.k}" type="text" value="${esc(val)}" ${c.lista ? `list="${id}-l"` : ""} placeholder="${esc(c.ph || "")}">${c.lista ? `<datalist id="${id}-l">${c.lista.map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : ""}`;
    return `<label for="${id}">${esc(c.rot)}${inp}</label>`;
  };
  const grupos = []; let par = [];
  for (const c of campos) { if (c.meia) { par.push(campo(c)); if (par.length === 2) { grupos.push(`<div class="duas">${par.join("")}</div>`); par = []; } } else { if (par.length) { grupos.push(`<div class="duas">${par.join("")}</div>`); par = []; } grupos.push(campo(c)); } }
  if (par.length) grupos.push(`<div class="duas">${par.join("")}</div>`);
  $("#caixa").innerHTML = `<h2>${esc(titulo)}</h2>${extra}<form class="form" id="form">${grupos.join("")}<div class="acoes"><button class="btn pri" type="submit">Salvar</button><button class="btn" type="button" data-fechar>Cancelar</button></div></form>`;
  $("#modal").hidden = false; setTimeout(() => $("#form").querySelector("input,textarea,select")?.focus(), 30);
  $("#form").onsubmit = e => { e.preventDefault(); const out = {}; for (const c of campos) { const el = $("#form").elements[c.k]; out[c.k] = c.tipo === "date" ? deIso(el.value) : el.value.trim(); } fecharModal(); aoSalvar(out); };
}

/* Busca geral */
function buscaGeral(qRaw) {
  const q = norm(qRaw); const termos = q.split(/\s+/).filter(Boolean);
  const ok = t => termos.every(x => norm(t).includes(x));
  const grupos = [
    ["Clientes", col.clientes().filter(c => ok(JSON.stringify(c))).map(c => ({ t: c.nome, s: `${c.segmento} · ${c.cidade}`, ir: ["clientes", c.id] }))],
    ["Prospecção", col.prospects().filter(p => ok(`${p.nome} ${p.segmento} ${p.contato} ${p.mensagem} ${p.proximaAcao} ${p.whatsapp}`)).map(p => ({ t: p.nome, s: `${p.status} · ${p.segmento}`, ir: ["prospeccao", p.id] }))],
    ["Scripts", col.scripts().filter(s => ok(`${s.titulo} ${s.texto} ${s.uso}`)).map(s => ({ t: s.titulo, s: `${s.etapa} · ${s.canal}`, ir: ["scripts", s.id] }))],
    ["Conteúdos", col.conteudos().filter(x => ok(`${x.titulo} ${x.texto} ${x.relacionado}`)).map(x => ({ t: x.titulo, s: `${x.formato} · ${x.relacionado}`, ir: ["conteudos", x.id] }))],
    ["Ideias", col.ideias().filter(x => ok(`${x.titulo} ${x.texto} ${x.relacionado}`)).map(x => ({ t: x.titulo, s: `${x.categoria} · ${x.prioridade}`, ir: ["ideias", x.id] }))],
    ["Tarefas", col.tarefas().filter(t => ok(`${t.titulo} ${t.relacionado} ${t.obs}`)).map(t => ({ t: t.titulo, s: `${t.prazo || "sem data"} · ${t.status}`, ir: ["planejamento", t.id] }))],
    ["Estúdio criativo", [...col.estudio().filter(x => ok(`${x.titulo} ${x.tipo} ${x.cliente} ${x.objetivo} ${(x.quadros || []).map(q => q.texto + " " + q.visual).join(" ")}`)).map(x => ({ t: x.titulo, s: `${x.tipo} · ${x.status}`, ir: ["estudio", x.id] })), ...col.refs().filter(r => ok(`${r.titulo} ${r.nota} ${r.tags} ${r.url}`)).map(r => ({ t: r.titulo || r.url || "Referência", s: "Referência · " + (r.tags || ""), ir: ["estudio", null] }))]],
    ["Base estratégica", DADOS.base.filter(b => ok(`${b.titulo} ${b.texto}`)).map(b => ({ t: b.titulo, s: "Base estratégica", ir: ["base", null] }))],
  ].filter(g => g[1].length);
  const total = grupos.reduce((s, g) => s + g[1].length, 0);
  return `<div class="cab"><div><h1>Busca: “${esc(qRaw)}”</h1><p>${total} resultado(s)</p></div><button class="btn" data-limpar-busca>Limpar busca</button></div>
  ${grupos.length ? `<div class="grid g2">${grupos.map(([rot, its]) => `<div class="card"><h2>${rot} <span class="small muted">${its.length}</span></h2><div class="lista">${its.slice(0, 12).map(i => `<div class="item clic" data-ir="${i.ir[0]}" data-id="${esc(i.ir[1] || "")}"><b>${esc(i.t)}</b><span class="small muted">${esc(i.s)}</span></div>`).join("")}</div>${its.length > 12 ? `<p class="small muted">+ ${its.length - 12} resultado(s)</p>` : ""}</div>`).join("")}</div>` : vazio("Nada encontrado. Tente outra palavra, como o nome de uma empresa, um telefone ou um tema.")}`;
}

async function iaEstrutura(p) {
  if (!SAMPLE) return toast("A sugestão com IA funciona na Central publicada.");
  const motion = ehMotion(p.tipo); const ctl = new AbortController();
  $("#caixa").innerHTML = `<h2>Sugestão de ${motion ? "cenas" : "quadros"}</h2><p class="muted" id="ia-st">Pensando no briefing…</p><div class="acoes"><button class="btn" type="button" id="ia-parar">Parar</button></div>`;
  $("#modal").hidden = false; $("#ia-parar").onclick = () => { ctl.abort(); fecharModal(); };
  const kit = col.kits().find(k => k.id === p.kit) || col.kits().find(k => relDe({ relacionado: k.cliente }, p.cliente));
  const prompt = `Você é diretor de arte de uma assessoria de marketing no Mato Grosso do Sul. Monte a estrutura de ${motion ? "um vídeo curto (cenas)" : p.tipo === "Carrossel" ? "um carrossel de Instagram (slides)" : "uma peça de " + p.tipo + " (quadros ou variações)"} em português do Brasil, direto e sem promessa de resultado.
Briefing:
${briefingTexto(p)}
${kit ? `Marca: ${kit.nome}. Tom: ${kit.tom}. Elementos: ${kit.elementos}.` : ""}
Responda só com um array JSON de ${motion ? "4 a 8" : p.tipo === "Carrossel" ? "5 a 8" : "1 a 4"} objetos, na ordem, no formato:
[{"texto": "texto que aparece na peça", "visual": "o que mostrar e como compor"${motion ? ', "duracao": "0–3 s", "movimento": "câmera ou animação", "audio": "fala, trilha ou efeito"' : ""}}]`;
  try {
    const arr = await SAMPLE.json(prompt, { signal: ctl.signal, cache: false });
    const lista = (Array.isArray(arr) ? arr : []).filter(x => x && (x.texto || x.visual)).map(x => ({ id: novoId("q"), texto: String(x.texto || ""), visual: String(x.visual || ""), ...(motion ? { duracao: String(x.duracao || ""), movimento: String(x.movimento || ""), audio: String(x.audio || "") } : {}) }));
    if (!lista.length) { $("#ia-st").textContent = "A sugestão veio vazia. Tente de novo ou detalhe mais o briefing."; return; }
    $("#caixa").innerHTML = `<h2>Sugestão de ${motion ? "cenas" : "quadros"}</h2><p class="small muted">Revise antes de usar. Você pode editar cada item depois.</p><ol style="padding-left:20px;display:grid;gap:8px">${lista.map(q => `<li><b>${esc(q.texto)}</b><div class="small muted">${esc(q.visual)}${q.duracao ? " · " + esc(q.duracao) : ""}</div></li>`).join("")}</ol><div class="acoes"><button class="btn pri" id="ia-add">Adicionar ao final</button>${(p.quadros || []).length ? '<button class="btn" id="ia-sub">Substituir os atuais</button>' : ""}<button class="btn" data-fechar>Descartar</button></div>`;
    $("#ia-add").onclick = () => { fecharModal(); render.manter = true; salvar("estudio", p.id, { quadros: [...(p.quadros || []), ...lista] }, { novo: !!p._novo }); };
    const sub = $("#ia-sub"); if (sub) sub.onclick = () => { fecharModal(); render.manter = true; salvar("estudio", p.id, { quadros: lista }, { novo: !!p._novo }); };
  } catch (e) {
    if (e?.code === "cancelled") return;
    const msg = { not_granted: "A IA não foi autorizada nesta página.", rate_limited: "Limite de uso atingido. Tente mais tarde.", invalid_json: "A resposta veio num formato inesperado. Tente de novo.", refused: "A IA não quis responder a esse briefing. Ajuste o texto." }[e?.code] || "Não consegui gerar a sugestão agora.";
    const el = $("#ia-st"); if (el) el.textContent = msg; else toast(msg);
    if (["not_granted", "sampling_disabled", "capability_disabled", "not_declared"].includes(e?.code)) { SAMPLE = null; render.manter = true; render(); }
  }
}
