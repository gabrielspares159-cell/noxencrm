# Serve só a Central e o painel gerados. O resto do projeto (CRM, fichas) não fica acessível.
server {
    listen 80;
    root /srv;
    charset utf-8;
    add_header Cache-Control "no-cache";

    location = / {
        try_files /central/index.html =404;
    }
    location = /painel {
        try_files /painel.html =404;
    }
    location / {
        return 404;
    }
}
